<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #f5f5f5;
        }
        
        header {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #6366f1;
        }
        
        nav a {
            margin-left: 1.5rem;
            text-decoration: none;
            color: #333;
        }
        
        .hero {
            background: linear-gradient(135deg, #6366f1, #10b981);
            color: white;
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .products {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        
        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .product-info {
            padding: 1.5rem;
        }
        
        .product-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        
        .product-price {
            color: #6366f1;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .add-to-cart {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0.8rem;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .add-to-cart:hover {
            background: #4f46e5;
        }
        
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }
        
        .cart-count {
            background: #ef4444;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-size: 0.8rem;
            margin-left: 0.3rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">✨ DigitalStore</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart <span class="cart-count" id="cartCount">0</span></a>
        </nav>
    </header>

    <div class="hero">
        <h1>Premium Digital Products</h1>
        <p>Wallpapers • Icons • Templates • Presets</p>
    </div>

    <div class="products" id="productsContainer"></div>

    <footer>
        <p>&copy; 2024 DigitalStore. Portfolio Project</p>
    </footer>

    <script>
        // Products data
        const products = [
            {
                id: 1,
                name: "Mountain Sunset Wallpapers",
                price: 4.99,
                image: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400"
            },
            {
                id: 2,
                name: "Social Media Icons Pack",
                price: 2.99,
                image: "https://cdn-icons-png.flaticon.com/512/733/733547.png"
            },
            {
                id: 3,
                name: "Freelancer Notion Template",
                price: 5.99,
                image: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=400"
            },
            {
                id: 4,
                name: "Dark Mood Lightroom Presets",
                price: 3.99,
                image: "https://images.unsplash.com/photo-1542038784456-1ea8e935640e?w=400"
            },
            {
                id: 5,
                name: "City Night Wallpapers",
                price: 4.99,
                image: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=400"
            },
            {
                id: 6,
                name: "Business Icons Set",
                price: 3.99,
                image: "https://cdn-icons-png.flaticon.com/512/1055/1055644.png"
            }
        ];

        // Shopping cart
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Display products
        function displayProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">$${product.price}</div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Add to cart function
        window.addToCart = function(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert(`${product.name} added to cart!`);
        }

        // Update cart count
        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.length;
        }

        // Initialize
        displayProducts();
        updateCartCount();
    </script>
</body>
</html>
